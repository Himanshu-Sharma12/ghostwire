[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostwire-cli"
version = "0.2.0"
description = "Turn browser traffic (HAR) into OpenAPI specs, typed Python & TypeScript SDKs, mock servers and Postman collections"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Himanshu Sharma" }
]
keywords = [
    "reverse-engineering",
    "api",
    "har",
    "openapi",
    "sdk-generator",
    "postman",
    "mock-server",
    "developer-tools",
    "web-scraping",
    "fastapi"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Internet :: WWW/HTTP",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing :: Mocking"
]
dependencies = [
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "openapi-spec-validator>=0.7.0"
]

[project.urls]
Homepage = "https://github.com/Himanshu-Sharma12/ghostwire"
Repository = "https://github.com/Himanshu-Sharma12/ghostwire"
Issues = "https://github.com/Himanshu-Sharma12/ghostwire/issues"
Changelog = "https://github.com/Himanshu-Sharma12/ghostwire/blob/main/CHANGELOG.md"

[project.scripts]
ghostwire = "ghostwire.cli:main"
gw = "ghostwire.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ghostwire*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
